name: Generate Lunch iCal

on:
  schedule:
    - cron: "0 21 * * 0"   # Sunday 5 PM ET
    - cron: "0 12 * * 1"   # Monday 8 AM ET
    - cron: "0 21 * * 1"   # Monday 5 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate BCPS iCal
        run: python generate_ical.py

      - name: Generate Loyola Lunch iCal
        env:
          LUNCHTAB_COOKIE: ${{ secrets.LUNCHTAB_COOKIE }}
        run: python generate_ical_loyola.py

      - name: Generate Cole Calendar Split
        run: python generate_ical_cole.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in lunch.ics loyola-lunch.ics cole-classes.ics cole-assignments.ics loyola-activities.ics; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update calendars $(date -u +'%Y-%m-%d')"
          git push
