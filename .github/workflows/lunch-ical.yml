name: Generate Lunch iCal

on:
  schedule:
    - cron: "0 22 * * 0"   # Sunday 5 PM EST
    - cron: "0 12 * * 1"   # Monday 7 AM EST
    - cron: "0 22 * * 1"   # Monday 5 PM EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate BCPS iCal
        run: python generate_ical.py

      - name: Generate Loyola Lunch iCal
        env:
          LUNCHTAB_COOKIE: ${{ secrets.LUNCHTAB_COOKIE }}
        run: python generate_ical_loyola.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in lunch.ics loyola-lunch.ics; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update lunch calendars $(date -u +'%Y-%m-%d')"
          git push
