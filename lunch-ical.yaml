name: Generate Lunch iCal

on:
  schedule:
    - cron: "0 23 * * 0"
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate BCPS iCal
        run: python generate_ical.py

      - name: Generate Loyola Lunch iCal
        env:
          LUNCHTAB_COOKIE: ${{ secrets.LUNCHTAB_COOKIE }}
        run: python generate_ical_loyola.py

      - name: Generate Cole Calendar Split
        run: python generate_ical_cole.py

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lunch.ics 2>/dev/null || true
          git add loyola-lunch.ics 2>/dev/null || true
          git add cole-classes.ics 2>/dev/null || true
          git add cole-assignments.ics 2>/dev/null || true
          git add loyola-activities.ics 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update calendars $(date -u +'%Y-%m-%d')"
          git push
