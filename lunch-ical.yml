name: Generate Lunch iCal

on:
  # Run every Sunday at 6 PM Eastern (11 PM UTC) so the week's menu is ready Monday morning
  schedule:
    - cron: "0 23 * * 0"

  # Also run Monday–Friday at 7 AM Eastern (12 PM UTC) to catch any menu updates
  # schedule:
  #   - cron: "0 12 * * 1-5"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate iCal
        run: python generate_ical.py

      - name: Commit and push updated lunch.ics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lunch.ics
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update lunch menu $(date -u +'%Y-%m-%d')"
          git push
